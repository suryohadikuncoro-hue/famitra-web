<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141517">
  <title>Offline — SI-FaMitra</title>
  <link rel="icon" href="/icons/famitra-192.png" type="image/png">
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#141517;color:#f5f6f7}
    *{box-sizing:border-box}
    body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,440px);padding:32px 26px;border:1px solid #35363b;border-radius:24px;background:#202125;text-align:center}
    img{width:72px;height:72px;object-fit:cover;border-radius:17px}
    h1{margin:20px 0 10px;font-size:23px}
    p{margin:10px 0;color:#c5c7ce;font-size:14px;line-height:1.65}
    .warning{margin-top:20px;padding:13px;border-radius:12px;background:#3b2922;color:#ffd6c3;font-weight:600}
    a{display:inline-block;margin-top:22px;padding:12px 18px;border-radius:12px;background:#ce2c2b;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="/icons/famitra-192.png" alt="">
    <h1>Anda sedang offline</h1>
    <p>SI-FaMitra memerlukan koneksi internet untuk masuk, memuat data, dan mengirim perubahan ke server.</p>
    <p class="warning">Transaksi yang belum mendapat konfirmasi server belum tersimpan. Tidak ada transaksi yang diantrekan saat offline.</p>
    <a href="/">Coba lagi</a>
  </main>
</body>
</html>
