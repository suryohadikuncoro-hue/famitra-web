name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy edge functions
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: xixhazawndmgqzstfjnq

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify CLI and source
        run: |
          supabase --version
          test -f supabase/functions/api/index.ts
          test -f supabase/functions/promo/index.ts
          test -f supabase/functions/marketing/index.ts
          test -f supabase/functions/lottery/index.ts
          test -f supabase/functions/hutang/index.ts
          grep -n "ppn: data.PPN" supabase/functions/api/index.ts

      - name: Deploy api
        run: |
          supabase functions deploy api \
            --project-ref "$PROJECT_ID"

      - name: Deploy promo
        run: |
          supabase functions deploy promo \
            --project-ref "$PROJECT_ID"

      - name: Deploy marketing
        run: |
          supabase functions deploy marketing \
            --project-ref "$PROJECT_ID"

      - name: Deploy lottery
        run: |
          supabase functions deploy lottery \
            --project-ref "$PROJECT_ID"

      - name: Deploy hutang
        run: |
          supabase functions deploy hutang \
            --project-ref "$PROJECT_ID"
